---
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Create Android project
        run: >
          flutter create --org com.cctvdoctor --project-name cctv_doctor
          --platforms android .
      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          text = text.replace('<manifest ', '<manifest ', 1)
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '>',
                  '>\n    <uses-permission '
                  'android:name="android.permission.INTERNET"/>',
                  1,
              )
          text = text.replace(
              'android:label="cctv_doctor"',
              'android:label="CCTV Doctor"',
          )
          path.write_text(text)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CCTV-Doctor-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
