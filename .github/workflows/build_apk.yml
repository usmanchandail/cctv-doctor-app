---
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Create app icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image

          logo = Image.open('assets/logo.png').convert('RGBA')
          target_width = int(512 * 0.75)
          target_height = round(logo.height * target_width / logo.width)
          logo = logo.resize((target_width, target_height), Image.Resampling.LANCZOS)

          canvas = Image.new('RGBA', (512, 512), '#000000')
          position = ((512 - logo.width) // 2, (512 - logo.height) // 2)
          canvas.alpha_composite(logo, position)
          canvas.save('assets/app_icon.png')
          PY
      - name: Create Android project
        run: >
          flutter create --org com.cctvdoctor --project-name cctv_doctor
          --platforms android .
      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          text = text.replace('<manifest ', '<manifest ', 1)
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '>',
                  '>\n    <uses-permission '
                  'android:name="android.permission.INTERNET"/>',
                  1,
              )
          text = text.replace(
              'android:label="cctv_doctor"',
              'android:label="CCTV Doctor"',
          )
          path.write_text(text)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CCTV-Doctor-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
