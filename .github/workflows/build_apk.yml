---
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Prepare app logo
        run: |
          mkdir -p assets
          if [ -f logo.png ]; then
            cp logo.png assets/logo.png
          else
            python3 - <<'PY'
          import struct
          import zlib

          width = height = 512
          row = b'\x00' + b'\x0A\x19\x2F\xFF' * width
          raw = row * height
          def chunk(name, data):
              checksum = struct.pack('>I', zlib.crc32(name + data) & 0xffffffff)
              return struct.pack('>I', len(data)) + name + data + checksum
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(
              b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
          )
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          with open('assets/logo.png', 'wb') as output:
              output.write(png)
          PY
          fi
      - name: Create Android project
        run: >
          flutter create --org com.cctvdoctor --project-name cctv_doctor
          --platforms android .
      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          text = text.replace('<manifest ', '<manifest ', 1)
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '>',
                  '>\n    <uses-permission '
                  'android:name="android.permission.INTERNET"/>',
                  1,
              )
          text = text.replace(
              'android:label="cctv_doctor"',
              'android:label="CCTV Doctor"',
          )
          path.write_text(text)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CCTV-Doctor-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
